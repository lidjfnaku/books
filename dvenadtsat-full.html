        <h1>Двенадцать</h1>
        <div class="author">Александр Блок</div>
        
        <div class="poem-fragment">
                    <p>Черный вечер.<br>
                    Белый снег.<br>
                    Ветер, ветер!<br>
                    На ногах не стоит человек.<br>
                    Ветер, ветер —<br>
                    На всем Божьем свете!</p>
                    
                    <p>Завивает ветер<br>
                    Белый снежок.<br>
                    Под снежком — ледок.<br>
                    Скользко, тяжко,<br>
                    Всякий ходок<br>
                    Скользит — ах, бедняжка!</p>
