    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для новой шапки — в едином стиле с сайтом */
        .main-header {
            background: #fefcf5;
            border-bottom: 1px solid #e8e2d4;
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .main-nav {
            max-width: 1200px;
            margin: 0 auto;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
        }
        .nav-link {
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            color: #2b2b28;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
            padding: 6px 0;
            letter-spacing: 0.3px;
        }
        .nav-link:hover {
            color: #9b6a5c;
            transform: translateY(-1px);
        }
        
        /* остальные стили как в твоём оригинале */
        .hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 400;
            color: #2b2b28;
            letter-spacing: -0.3px;
            max-width: 900px;
            margin: 0 auto;
        }
        .hero p {
            margin-top: 24px;
            color: #5e5b55;
            font-size: 1.15rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .next-button {
            display: inline-block;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #d9cdbb;
            border-radius: 40px;
            color: #7e6f5c;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .next-button:hover {
            background: #f3efe8;
            border-color: #bc9a6c;
            color: #9b6a5c;
            transform: translateX(4px);
        }
        .footer {
            border-top: 1px solid #e8e2d4;
            padding: 40px 0;
            text-align: center;
            color: #8b8478;
            font-size: 0.85rem;
            margin-top: 40px;
        }
        .values-header {
            padding: 48px 0 24px;
            border-bottom: 1px solid #e8e2d4;
        }
        .values-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 28px;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 500;
        }
        .value-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s;
            cursor: pointer;
        }
        .value-link:hover {
            transform: translateY(-3px);
            opacity: 0.8;
        }
        .value-1 { color: #9b6a5c; }
        .value-2 { color: #6f8f6a; }
        .value-4 { color: #c17a5c; }
        .value-5 { color: #bc9a6c; }
        .value-7 { color: #7e8f6e; }
        .value-8 { color: #a57164; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }
        @media (max-width: 700px) {
            .hero h1 { font-size: 1.9rem; }
            .main-header { padding: 12px 16px; }
            .nav-links { gap: 16px; }
            .nav-link { font-size: 0.8rem; }
            .values-cloud { font-size: 1rem; gap: 12px 18px; }
            .container { padding: 0 20px; }
        }
    </style>
</head>
